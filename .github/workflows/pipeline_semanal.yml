name: Pipeline Semanal SSP-SP (backup manual)

# O agendamento semanal principal é feito pelo Job nativo do Databricks
# (Job ID 885399393946221, schedule: segunda 06h BRT, serverless).
#
# Este workflow serve como disparador manual de emergência ou como evidência
# de integração GitHub Actions ↔ Databricks para o TCC.

on:
  workflow_dispatch:   # apenas trigger manual — o Job Databricks gerencia o schedule

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Disparar Job no Databricks
        id: submit
        run: |
          RESPONSE=$(curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.DATABRICKS_TOKEN }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.DATABRICKS_HOST }}/api/2.0/jobs/run-now" \
            -d '{"job_id": 885399393946221}')
          echo "Resposta da API: $RESPONSE"
          RUN_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['run_id'])")
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Run disparado com ID: $RUN_ID"

      - name: Aguardar conclusao (poll a cada 60 s, max 3h)
        id: wait
        run: |
          RUN_ID="${{ steps.submit.outputs.run_id }}"
          for i in $(seq 1 180); do
            PAYLOAD=$(curl -sf \
              -H "Authorization: Bearer ${{ secrets.DATABRICKS_TOKEN }}" \
              "${{ secrets.DATABRICKS_HOST }}/api/2.1/jobs/runs/get?run_id=$RUN_ID")
            STATE=$(echo "$PAYLOAD" | python3 -c \
              "import sys,json; print(json.load(sys.stdin)['state']['life_cycle_state'])")
            echo "[$(date -u +%H:%M:%S)] [$i/180] Estado: $STATE"
            case "$STATE" in
              TERMINATED|SKIPPED|INTERNAL_ERROR)
                RESULT=$(echo "$PAYLOAD" | python3 -c \
                  "import sys,json; print(json.load(sys.stdin)['state'].get('result_state','UNKNOWN'))")
                echo "result=$RESULT" >> "$GITHUB_OUTPUT"
                echo "Estado final: $RESULT"
                break ;;
            esac
            sleep 60
          done

      - name: Verificar resultado
        run: |
          RESULT="${{ steps.wait.outputs.result }}"
          if [[ "$RESULT" != "SUCCESS" ]]; then
            echo "Pipeline falhou ou nao concluiu: $RESULT"
            exit 1
          fi
          echo "Pipeline concluido com sucesso."

# Segredos necessarios no repositorio (Settings -> Secrets -> Actions):
#   DATABRICKS_HOST    ex.: https://dbc-2f87f535-bfcf.cloud.databricks.com
#   DATABRICKS_TOKEN   token gerado em User Settings -> Access Tokens
#
# DATABRICKS_CLUSTER_ID nao e necessario — o Job usa compute serverless.
# DATABRICKS_USER nao e necessario — o Job dispara pelo ID fixo.
